<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daybook">
<meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f151c" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Daybook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Public+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column. Header with today's progress ring, a week strip, then three task cards for the day, then anything still open from earlier days. */
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#15212e; --muted:#5d6b79; --line:#d6dde4;
  --accent:#c4620a; --accent-soft:#fbead8; --done:#2f8a64;
  --c-career:#2f6fd6; --c-meridian:#b0420d; --c-class:#0f8a8f; --c-rest:#7d8a97;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --surface:#17202a; --ink:#e6ecf2; --muted:#93a1af; --line:#26323e;
  --accent:#f0913a; --accent-soft:#3a2614; --done:#4cc08d;
  --c-career:#6aa0ff; --c-meridian:#f07a3e; --c-class:#3cc7cc; --c-rest:#8795a3; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f151c; --surface:#17202a; --ink:#e6ecf2; --muted:#93a1af; --line:#26323e;
  --accent:#f0913a; --accent-soft:#3a2614; --done:#4cc08d;
  --c-career:#6aa0ff; --c-meridian:#f07a3e; --c-class:#3cc7cc; --c-rest:#8795a3; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.brand{font-family:var(--f-display);font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.dayhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px}
.dayhead h1{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,8vw,40px);line-height:1;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin-top:6px;font-family:var(--f-mono)}
.ring{flex:none;width:72px;height:72px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;text-align:center;line-height:1.1}
.ring .num b{font-family:var(--f-display);font-size:18px;display:block}
.weekbar{display:flex;align-items:center;gap:6px}
.weekbar .nav{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;width:34px;height:52px;color:var(--muted)}
.weekbar .nav:disabled{opacity:.35;cursor:default}
.days{flex:1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dchip{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 0 7px;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.dchip .dw{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dchip .dn{font-family:var(--f-display);font-weight:700;font-size:16px}
.dots{display:flex;gap:3px;min-height:5px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--done)}
.dchip.today{border-color:var(--accent)}
.dchip.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.dchip.sel .dw{color:var(--bg);opacity:.75}
.dchip.out{opacity:.35}
.focus{background:var(--accent-soft);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:baseline}
.focus .lab{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--accent);flex:none}
.focus .txt{font-weight:600}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;grid-template-columns:4px minmax(0,1fr) 40px;gap:0 14px;align-items:center}
.task .bar{align-self:stretch;border-radius:2px}
.task .tag{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.task .ttl{font-weight:600;font-size:16px}
.task .det{color:var(--muted);font-size:13.5px;margin-top:4px}
.task .from{font-family:var(--f-mono);font-size:11px;color:var(--accent);margin-top:6px}
.task.done .ttl,.task.done .det{text-decoration:line-through;color:var(--muted)}
.chk{width:34px;height:34px;border-radius:9px;border:2px solid var(--line);background:none;display:grid;place-items:center;padding:0}
.chk svg{width:18px;height:18px;opacity:0}
.task.done .chk{background:var(--done);border-color:var(--done)}
.task.done .chk svg{opacity:1}
h2{font-family:var(--f-display);font-size:15px;margin:8px 0 0;letter-spacing:.02em}
.hint{color:var(--muted);font-size:13px;margin:0}
.rest{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:18px;text-align:center;color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.iconbtn{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted)}
.note{font-size:12.5px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.chk{transition:background .15s,border-color .15s}}
</style>

<div class="wrap">
  <span class="brand">Daybook</span>
  <section class="dayhead">
    <div><h1 id="dayTitle"></h1><div class="sub" id="daySub"></div></div>
    <div class="ring" aria-hidden="true">
      <svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.5" fill="none" stroke="var(--line)" stroke-width="3"/><circle id="ringArc" cx="18" cy="18" r="15.5" fill="none" stroke="var(--done)" stroke-width="3" stroke-linecap="round" stroke-dasharray="0 100" pathLength="100"/></svg>
      <div class="num"><span><b id="ringNum">0/3</b>done</span></div>
    </div>
  </section>
  <nav class="weekbar" aria-label="Week">
    <button class="nav" id="prevWeek" type="button" aria-label="Previous week">‹</button>
    <div class="days" id="days"></div>
    <button class="nav" id="nextWeek" type="button" aria-label="Next week">›</button>
  </nav>
  <div class="focus" id="focus"><span class="lab">Focus</span><span class="txt" id="focusTxt"></span></div>
  <ul class="tasks" id="tasks"></ul>
  <div class="rest" id="restDay" hidden></div>
  <section id="openSec" hidden>
    <h2>Still open from earlier</h2>
    <p class="hint">These carry forward until you check them off. Do the Meridian ones first.</p>
    <ul class="tasks" id="openTasks" style="margin-top:10px"></ul>
  </section>
  <div class="foot">
    <span class="note" id="anchor"></span>
    <button class="iconbtn" id="todayBtn" type="button">Go to today</button>
  </div>
</div>

<script>
(function(){
const START="2026-11-24", END="2026-12-06";
const M="meridian", C="class", K="career";
const PLAN={
 "2026-11-24":[
  [M,"Finish snapshot notes","Page 10: what a snapshot is, the gain (less smear), the cost (writes to the cluster), and the to-confirm: do older snapshots already exist?"],
  [M,"Tradeoff table: target layer","Columns: option · what it gets you · what it costs · decision. Rows: application layer, infrastructure (MooseFS), other evidence (jump host, NetFlow, firewall logs)"],
  [C,"CMSC 240: arrays","Reverse an int array in place. Draw the memory on paper first, then make it ASan clean"]],
 "2026-11-25":[
  [M,"Tradeoff table: acquisition strategy","Rows: dead box, pure live, hybrid (one chunkserver at a time), DR site and backups. Use your pages 7 and 8 and the blog citation"],
  [M,"NIST SP 800-86 and RFC 3227","Read the order-of-volatility parts, then write a ranked preservation list. Include expiring logs (raw SIEM 30 days) and MooseFS trash"],
  [C,"CMSC 240: strings","Write your own strlen, then a copy that moves one char at a time and adds the '\\0'"]],
 "2026-11-26":[],
 "2026-11-27":[
  [M,"Tradeoff table: OS, tools, system state","Linux vs Windows, which tools (memory, disk, MooseFS's own), and how you record cluster state before and after"],
  [M,"PCI DSS Req. 10 and 12.10, plus integrity model","What PCI requires for logs and incident response, then your answer: how you hash and prove copies weren't altered"],
  [C,"CMSC 240: dynamic memory and one redo","Return a new copy of a string (malloc, check NULL, free in main), then redo stats from scratch"]],
 "2026-11-28":[
  [M,"Draft: tradeoffs and strategy sections","Turn the tables into paragraphs. One paragraph per decision: what you chose, what you rejected, what it costs"],
  [M,"Draft: integrity and limits sections","Include your to-confirm list as assumptions, and what your method does NOT do"],
  [C,"CMSC 240: full mock exam","All four, timed. Comments first. Get three fully clean before the fourth"]],
 "2026-11-29":[
  [M,"Draft: executive summary and citations","Write the summary last. Check every citation has a source in your references"],
  [C,"CMSC 240: fix what the mock exposed","Redo the problem you missed, from scratch"],
  [M,"First out-loud defense run","Explain your approach in 5 minutes, out loud. Note where you stumble"]],
 "2026-11-30":[
  [M,"Final pass on the report","Read it top to bottom once. Fix anything unclear"],
  [M,"Defense questions 1–5 out loud","Why live? Why this layer? How do you prove integrity? What can't you see? What would you do differently?"],
  [C,"CMSC 240: one retake practice problem","Timed, comment first, ASan clean. Skip once the retake is done"]],
 "2026-12-01":[
  [M,"Defense questions 6–10 out loud","Smear, the insider angle, the version unknowns, PCI, and your tool choices"],
  [M,"Check the syllabus and submit if due","Confirm the report and oral defense dates"],
  [C,"CMSC 240: redo your weakest problem","Timed, ASan clean. Skip once the retake is done"]],
 "2026-12-02":[
  [M,"Final read, submit if not yet","Last look at formatting and citations"],
  [C,"CMSC 240: one retake practice problem","Skip once the retake is done"],
  [K,"Security+: Dion Domain 1, next section","Or 15 minutes of flashcards if the day is full"]],
 "2026-12-03":[
  [M,"5-minute walkthrough out loud","The whole approach, start to finish, no notes"],
  [C,"CMSC 240: short mock (three problems)","Skip once the retake is done"],
  [K,"Python: Automate the Boring Stuff ch. 3","Practice questions first; skim if you get most of them"]],
 "2026-12-04":[
  [M,"Meridian final and oral defense","Check the syllabus for the exact time"],
  [K,"Security+: Dion Domain 1, next section",""],
  [K,"Python: ch. 4","Practice questions first"]],
 "2026-12-05":[
  [M,"1-page Meridian summary for your portfolio","What the problem was, your approach, and what it shows you can do"],
  [K,"Python: ch. 5",""],
  [K,"Security+: Domain 1 section quizzes",""]],
 "2026-12-06":[
  [K,"Weekly review","Tick off the week and plan finals"],
  [K,"Security+: 15 minutes of flashcards",""],
  [K,"Python: ch. 6","Then plan Project 1 in plain-English comments"]]
};
const FOCUS={
 "2026-11-24":"Three tasks, any order, any time. Snapshots first since it's half done.",
 "2026-11-26":"Thanksgiving. Day off.",
 "2026-11-28":"Big day: two draft sections and the C mock exam.",
 "2026-11-30":"Final week for Meridian. Report and oral defense dates are on the syllabus.",
 "2026-12-04":"Meridian final. After this, the career work picks back up."
};
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let checks=store.get("daybook.three",{});
const pad=n=>String(n).padStart(2,"0");
const toISO=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fromISO=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=fromISO(s);d.setDate(d.getDate()+n);return toISO(d)};
const DOW=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const CATN={meridian:"Meridian",class:"CMSC 240",career:"Career"};
const CHECK='<svg viewBox="0 0 16 16"><path d="M3 8.5l3 3 7-7" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const todayISO=toISO(new Date());
const clamp=s=>s<START?START:s>END?END:s;
const mondayOf=s=>{const d=fromISO(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return toISO(d)};
let sel=clamp(todayISO), weekStart=mondayOf(sel);
const key=(d,i)=>d+"#"+i;
const isDone=(d,i)=>!!checks[key(d,i)];
const toggle=(d,i)=>{checks[key(d,i)]=!checks[key(d,i)];store.set("daybook.three",checks);render()};
const isEarlySun=s=>{const d=fromISO(s);return d.getDay()===0&&Math.round((d-fromISO("2026-11-08"))/864e5)%14===0};
function anchor(s){
  const d=fromISO(s).getDay();
  if(isEarlySun(s))return"Work 5:00–1:30 · lights out by 9:30";
  if(d===6&&isEarlySun(addDays(s,1)))return"Up at 4:00 tomorrow · lights out by 8:30";
  if(d===5||d===6||s==="2026-11-26")return"Up by 7:00 · lights out by 11:00";
  return"Up at 6:00 · lights out by 10:30";
}
function card(d,i,t,showFrom){
  const li=document.createElement("li");const done=isDone(d,i);
  li.className="task"+(done?" done":"");
  li.innerHTML='<div class="bar" style="background:var(--c-'+t[0]+')"></div><div><div class="tag" style="color:var(--c-'+t[0]+')"></div><div class="ttl"></div>'+(t[2]?'<div class="det"></div>':'')+(showFrom?'<div class="from"></div>':'')+'</div><button class="chk" type="button">'+CHECK+'</button>';
  li.querySelector(".tag").textContent=CATN[t[0]];
  li.querySelector(".ttl").textContent=t[1];
  if(t[2])li.querySelector(".det").textContent=t[2];
  if(showFrom){const x=fromISO(d);li.querySelector(".from").textContent="From "+DOW[x.getDay()].slice(0,3)+" "+MON[x.getMonth()]+" "+x.getDate()}
  const b=li.querySelector(".chk");b.setAttribute("aria-label",(done?"Uncheck ":"Check off ")+t[1]);b.setAttribute("aria-pressed",done);
  b.onclick=()=>toggle(d,i);
  return li;
}
function render(){
  const d=fromISO(sel);
  document.getElementById("dayTitle").textContent=sel===todayISO?"Today, "+DOW[d.getDay()]:DOW[d.getDay()];
  document.getElementById("daySub").textContent=MON[d.getMonth()]+" "+d.getDate();
  const days=document.getElementById("days");days.innerHTML="";
  for(let i=0;i<7;i++){
    const s=addDays(weekStart,i),dd=fromISO(s),inR=s>=START&&s<=END,L=PLAN[s]||[];
    const b=document.createElement("button");b.type="button";b.disabled=!inR;
    b.className="dchip"+(s===sel?" sel":"")+(s===todayISO?" today":"")+(inR?"":" out");
    b.innerHTML='<span class="dw">'+DOW[dd.getDay()].slice(0,3)+'</span><span class="dn">'+dd.getDate()+'</span><span class="dots">'+L.map((_,k)=>'<i class="'+(isDone(s,k)?"on":"")+'"></i>').join("")+'</span>';
    b.onclick=()=>{sel=s;render()};days.appendChild(b);
  }
  document.getElementById("prevWeek").disabled=weekStart<=mondayOf(START);
  document.getElementById("nextWeek").disabled=addDays(weekStart,7)>END;
  const f=FOCUS[sel];document.getElementById("focus").hidden=!f;document.getElementById("focusTxt").textContent=f||"";
  const L=PLAN[sel]||[],ul=document.getElementById("tasks");ul.innerHTML="";
  L.forEach((t,i)=>ul.appendChild(card(sel,i,t,false)));
  const rest=document.getElementById("restDay");rest.hidden=L.length>0;rest.textContent="Day off. Nothing to check.";
  const n=L.filter((_,i)=>isDone(sel,i)).length;
  document.getElementById("ringNum").textContent=n+"/"+L.length;
  document.getElementById("ringArc").setAttribute("stroke-dasharray",(L.length?n/L.length*100:0)+" 100");
  const open=[];
  for(let s=START;s<sel;s=addDays(s,1))(PLAN[s]||[]).forEach((t,i)=>{if(!isDone(s,i))open.push([s,i,t])});
  const os=document.getElementById("openSec"),ou=document.getElementById("openTasks");ou.innerHTML="";
  os.hidden=!open.length;open.forEach(([s,i,t])=>ou.appendChild(card(s,i,t,true)));
  document.getElementById("anchor").textContent=anchor(sel);
}
document.getElementById("prevWeek").onclick=()=>{weekStart=addDays(weekStart,-7);sel=clamp(weekStart);render()};
document.getElementById("nextWeek").onclick=()=>{weekStart=addDays(weekStart,7);sel=clamp(weekStart);render()};
document.getElementById("todayBtn").onclick=()=>{sel=clamp(todayISO);weekStart=mondayOf(sel);render()};
render();
})();
</script>
