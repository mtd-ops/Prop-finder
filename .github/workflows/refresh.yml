name: Build and publish Prop Finder
on:
  schedule:
    - cron: "45 10 * * *"   # about 6:45 AM Eastern: fresh stats + lines for games in the next 36 hours
    - cron: "15 22 * * *"   # about 6:15 PM Eastern: that day's practice reports
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: pages
        uses: actions/configure-pages@v5
      - name: Download stats and injury reports
        run: |
          mkdir -p site
          cp index.html site/
          python3 build_data.py site
      - name: Download DraftKings and FanDuel lines
        if: ${{ env.ODDS_API_KEY != '' }}
        continue-on-error: true
        run: |
          curl -sfL "${{ steps.pages.outputs.base_url }}/odds.json" -o site/odds.json || rm -f site/odds.json
          python3 build_odds.py site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
