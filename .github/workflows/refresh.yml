name: Build and publish Prop Finder
on:
  schedule:
    # times are UTC; Eastern is 4 hours behind until Nov 1, then 5
    - cron: "45 10 * * *"   # ~6:45 AM ET daily: fresh stats, and the first pull of lines for that day's games
    - cron: "15 22 * * *"   # ~6:15 PM ET daily: practice reports; refreshes Thu/Mon night lines before kickoff
    - cron: "30 15 * * 0"   # ~11:30 AM ET Sunday: refreshes 1 PM lines if the monthly credit budget allows
    - cron: "45 18 * * 0"   # ~2:45 PM ET Sunday: refreshes 4 PM lines if the budget allows
  push:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - id: pages
        uses: actions/configure-pages@v5
      - name: Download stats and injury reports
        run: |
          mkdir -p site
          cp index.html site/
          cp inbox.json site/ 2>/dev/null || true
          python3 build_data.py site
      - name: Download DraftKings and FanDuel lines
        if: ${{ env.ODDS_API_KEY != '' }}
        continue-on-error: true
        run: |
          curl -sfL "${{ steps.pages.outputs.base_url }}/odds.json" -o site/odds.json || rm -f site/odds.json
          curl -sfL "${{ steps.pages.outputs.base_url }}/closing.json" -o site/closing.json || rm -f site/closing.json
          python3 build_odds.py site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
